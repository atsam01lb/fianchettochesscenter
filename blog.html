    // ============ ARTICLE 2 ============
    {

      images: [

      ],
      body: `
        <p>Today marked a memorable and rewarding day for the Fianchetto Chess Center community.</p>

        <p>We began our journey with our weekly chess class at <strong>Al Iman School</strong>, where students continued developing their skills, strategic thinking, and passion for the game.</p>

        <p>Most importantly, we warmly welcome everyone who joined the <strong>Fianchetto family</strong> on this special day. We look forward to sharing many more chess experiences, events, and memorable moments together.</p>

    // ============ ARTICLE 3 ============
    {
      tag: 'Special Event',
      title: 'A Historic Milestone for Fianchetto Chess Center',
      date: 'October 16, 2022',
      excerpt: 'A remarkable milestone was added to the history of Fianchetto Chess Center with the successful organization of the first Bughouse Chess Tournament in North Lebanon.',
      images: [

      body: `

        <p>The success of this historic event would not have been possible without the commitment of every volunteer, organizer, arbiter, and participant. Fianchetto Chess Center looks forward to organizing many more tournaments and continuing to grow the Bughouse chess community in Lebanon.</p>
      `
    }

  ];


  // ============ RENDER CARDS ============

  const grid = document.getElementById('articlesGrid');
  const emptyState = document.getElementById('emptyState');

  if (articles.length === 0) {

    emptyState.style.display = 'block';

  } else {

    emptyState.style.display = 'none';

    articles.forEach((a, i) => {

      const card = document.createElement('div');

      card.className = 'article-card';
      card.dataset.index = i;

      card.innerHTML = `
        <div class="card-image">

          <span class="card-tag">
            ${a.tag}
          </span>

          <img
            src="${a.images[0]}"
            alt="${a.title}"
            onerror="this.src='https://images.unsplash.com/photo-1528819622765-d6bcf132f793?w=800&q=80'"
          >

        </div>

        <div class="card-body">

          <span class="card-date">
            ${a.date}
          </span>

          <h3 class="card-title" dir="auto">
            ${a.title}
          </h3>

          <p class="card-excerpt" dir="auto">
            ${a.excerpt}
          </p>

          <span class="card-read">
            Read Article
          </span>

        </div>
      `;

      card.addEventListener('click', () => openModal(i));

      grid.appendChild(card);

    });

  }


  // ============ MODAL LOGIC ============

  const overlay = document.getElementById('modalOverlay');

  const modal = document.getElementById('modal');

  const closeBtn = document.getElementById('modalClose');


  function openModal(index) {

    const a = articles[index];

    document.getElementById('modalTag').textContent = a.tag;

    document.getElementById('modalTitle').textContent = a.title;

    document.getElementById('modalDate').textContent = a.date;

    document.getElementById('modalBody').innerHTML = a.body || '';


    // ============ ARTICLE IMAGES ============

    const imagesContainer =
      document.getElementById('modalImages');

    const imgs = a.images || [];

    imagesContainer.innerHTML = imgs.map((img, i) => `

      <div class="modal-image">

        <img
          src="${img}"
          alt="${a.title} — photo ${i + 1}"
          onerror="this.src='https://images.unsplash.com/photo-1528819622765-d6bcf132f793?w=800&q=80'"
        >

      </div>

    `).join('');


    overlay.classList.add('active');

    document.body.classList.add('modal-open');

    overlay.scrollTop = 0;

  }


  function closeModal() {

    overlay.classList.remove('active');

    document.body.classList.remove('modal-open');

  }


  // Close button

  closeBtn.addEventListener('click', closeModal);


  // Click outside article to close

  overlay.addEventListener('click', (e) => {

    if (e.target === overlay) {

      closeModal();

    }

  });


  // ESC key closes article

  document.addEventListener('keydown', (e) => {

    if (
      e.key === 'Escape' &&
      overlay.classList.contains('active')
    ) {

      closeModal();

    }

  });


  // ============ MOBILE MENU ============

  const menuToggle =
    document.getElementById('menuToggle');

  const nav =
    document.getElementById('nav');


  menuToggle.addEventListener('click', () => {

    nav.classList.toggle('open');

  });

</script>
